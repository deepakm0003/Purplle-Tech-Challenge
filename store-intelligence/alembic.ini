# Alembic Configuration File
# Database migration management

[alembic]
# path to migration scripts
scriptLocation = alembic

# template used to generate migration file names
fileTemplate = %%(rev)s_%%(slug)s

# sys.path path separator
pathsep = :

# the output encoding used when revision files
# contain Unicode characters
sqlalchemyUrl = postgresql+asyncpg://postgres:postgres@localhost:5432/store_intelligence

[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
